<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#2563eb" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background with rounded corners -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="104" stroke="#334155" stroke-width="4" fill="none" opacity="0.6" />

  <!-- Center Shield / Emblem Badge -->
  <g filter="url(#shadow)">
    <!-- Heart / Health Icon Base -->
    <circle cx="256" cy="256" r="150" fill="url(#primaryGrad)" />
    
    <!-- Medical Pulse Sine Wave & Cross Motif -->
    <path 
      d="M160 256 H208 L230 200 L256 312 L282 220 L304 256 H352" 
      stroke="#ffffff" 
      stroke-width="22" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    
    <!-- Cross Accent -->
    <circle cx="256" cy="165" r="14" fill="#38bdf8" />
    <circle cx="256" cy="347" r="14" fill="#34d399" />
  </g>
</svg>
