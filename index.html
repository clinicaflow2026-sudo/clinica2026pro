<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <title>ClinicFlow Pro - Gestão para Clínicas de Fisioterapia, Pilates e Estética</title>
    <meta name="description" content="Sistema SaaS Multi-Tenant de Gestão para Clínicas de Fisioterapia, Pilates e Estética com Prontuário Eletrônico, Agendamentos, Financeiro e PWA." />
    
    <!-- PWA Primary Settings -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="ClinicFlow Pro" />

    <!-- iOS Apple Touch PWA Settings -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ClinicFlow Pro" />
    <link rel="apple-touch-icon" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/pwa-512x512.png" />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />

    <!-- Open Graph & Social -->
    <meta property="og:title" content="ClinicFlow Pro - Gestão para Clínicas de Fisioterapia, Pilates e Estética" />
    <meta property="og:description" content="Sistema SaaS Multi-Tenant de Gestão para Clínicas de Fisioterapia, Pilates e Estética com Prontuário Eletrônico, Agendamentos, Financeiro e PWA." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/pwa-512x512.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body class="bg-slate-50 text-slate-800 antialiased font-sans selection:bg-blue-600 selection:text-white">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('ClinicFlow Pro PWA ServiceWorker registered with scope:', registration.scope);
            })
            .catch((error) => {
              console.warn('PWA ServiceWorker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
